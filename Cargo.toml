[package]
name = "drone-vtx"
version = "0.1.0"
edition = "2024"

[dependencies]
# General utilities
log = { version = "0.4", features = ["std"] }
env_logger = "0.11"
clap = { version = "4.6", features = ["derive"] }
zerocopy = "0.8"
# Networking
libc = "0.2"
radiotap = "1.3"
reed-solomon-erasure = { version = "6.0", features = ["simd-accel"] }
# Video processing
v4l = "0.14"
openh264 = "0.9"
# Video display
image = "0.25"
minifb = "0.28"
